name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Go tests and native Xray reverse smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reverse_node
        uses: actions/checkout@v4

      - name: Checkout pinned Xray-core 26.3.27
        uses: actions/checkout@v4
        with:
          repository: qqq694637644/Xray-core
          ref: d2758a023cd7f4174a5a5fa4ff66e487d4342ba0
          path: .build/xray-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: |
            go.mod
            .build/xray-core/go.mod
            .build/xray-core/go.sum

      - name: Unit tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build pinned Xray-core
        working-directory: .build/xray-core
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/xray-v26.3.27" ./main
          "$RUNNER_TEMP/xray-v26.3.27" version | tee "$RUNNER_TEMP/xray-version.txt"
          grep -Fq 'Xray 26.3.27' "$RUNNER_TEMP/xray-version.txt"
          grep -Fq 'd2758a0' "$RUNNER_TEMP/xray-version.txt"

      - name: Build reverse_node
        run: go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/reverse_node" .

      - name: Reverse Portal/Bridge TCP, UDP, TLS pin and QUIC Brutal smoke
        run: python scripts/smoke_reverse.py --xray "$RUNNER_TEMP/xray-v26.3.27" --reverse-node "$RUNNER_TEMP/reverse_node"
